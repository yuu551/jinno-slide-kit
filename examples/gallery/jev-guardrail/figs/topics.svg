"594" y="155" font-family="'Noto Sans JP', 'Hiragino Sans', sans-serif" font-size="19" font-weight="700" fill="#3a3f44" text-anchor="start"><tspan x="594" dy="0">社員の健康・休職の情報</tspan></text><text x="1116" y="155" font-family="'Noto Sans JP', 'Hiragino Sans', sans-serif" font-size="17" font-weight="400" fill="#c2703d" text-anchor="end"><tspan x="1116" dy="0">制度の一般的な説明は除く</tspan></text><rect x="574" y="182" width="562" height="48" rx="6" fill="#f4f5f7"/><text x="594" y="213" font-family="'Noto Sans JP', 'Hiragino Sans', sans-serif" font-size="19" font-weight="700" fill="#3a3f44" text-anchor="start"><tspan x="594" dy="0">未発表の人事異動・退職</tspan></text><text x="1116" y="213" font-family="'Noto Sans JP', 'Hiragino Sans', sans-serif" font-size="17" font-weight="400" fill="#c2703d" text-anchor="end"><tspan x="1116" dy="0">公式の発表のあとは除く</tspan></text><rect x="574" y="240" width="562" height="48" rx="6" fill="#f4f5f7"/><text x="594" y="271" font-family="'Noto Sans JP', 'Hiragino Sans', sans-serif" font-size="19" font-weight="700" fill="#3a3f44" text-anchor="start"><tspan x="594" dy="0">個人の評価・給与</tspan></text><text x="1116" y="271" font-family="'Noto Sans JP', 'Hiragino Sans', sans-serif" font-size="17" font-weight="400" fill="#c2703d" text-anchor="end"><tspan x="1116" dy="0">一般的な相場は除く</tspan></text><rect x="574" y="298" width="562" height="48" rx="6" fill="#f4f5f7"/><text x="594" y="329" font-family="'Noto Sans JP', 'Hiragino Sans', sans-serif" font-size="19" font-weight="700" fill="#3a3f44" text-anchor="start"><tspan x="594" dy="0">未公表の障害の詳細</tspan></text><text x="1116" y="329" font-family="'Noto Sans JP', 'Hiragino Sans', sans-serif" font-size="17" font-weight="400" fill="#c2703d" text-anchor="end"><tspan x="1116" dy="0">公開済みの報告は除く</tspan></text><rect x="574" y="360" width="562" height="30" rx="6" fill="#fff" stroke="#b9c0c6" stroke-width="1.3" stroke-dasharray="7 5"/><text x="855" y="381" font-family="'Noto Sans JP', 'Hiragino Sans', sans-serif" font-size="17" font-weight="700" fi