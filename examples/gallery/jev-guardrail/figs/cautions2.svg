<svg xmlns="http://www.w3.org/2000/svg" width="1184" height="404" viewBox="-12 -12 1184 404"><!-- edited-in-editor: 2026-10-29 --><rect x="-12" y="-12" width="1184" height="404" fill="#fff"/><rect x="0" y="0" width="565" height="380" rx="8" fill="#f4f5f7"/><rect x="0" y="0" width="565" height="4" fill="#c2703d"/><g transform="translate(26.0 28) scale(0.6667)" fill="none" stroke="#c2703d" stroke-width="3.90" stroke-linecap="round" stroke-linejoin="round"><circle cx="39" cy="39" r="32"/><path d="M39 18V39L54 49"/></g><text x="96" y="64" font-family="'Noto Sans JP', 'Hiragino Sans', sans-serif" font-size="23" font-weight="700" fill="#3a3f44" text-anchor="start"><tspan x="96" dy="0">長い会話は通常の32k上限を超える</tspan></text><circle cx="36" cy="121" r="5" fill="#c2703d"/><text x="52" y="128" font-family="'Noto Sans JP', 'Hiragino Sans', sans-serif" font-size="20" font-weight="400" fill="#3d444b" text-anchor="start"><tspan x="52" dy="0">ヘッダーなしだと判定できない（400）</tspan></text><circle cx="36" cy="171" r="5" fill="#c2703d"/><text x="52" y="178" font-family="'Noto Sans JP', 'Hiragino Sans', sans-serif" font-size="20" font-weight="400" fill="#3d444b" text-anchor="start"><tspan x="52" dy="0">このヘッダーで 262k トークンまで広がる</tspan></text><circle cx="36" cy="221" r="5" fill="#c2703d"/><text x="52" y="228" font-family="'Noto Sans JP', 'Hiragino Sans', sans-serif" font-size="20" font-weight="400" fill="#3d444b" text-anchor="start"><tspan x="52" dy="0">遅く、精度も下がるので必要なときだけ</tspan></text><rect x="24" y="292" width="517" height="60" rx="6" fill="#fff" stroke="#b9c0c6" stroke-width="1.4"/><text x="40" y="318" font-family="'Noto Sans JP', 'Hiragino Sans', sans-serif" font-size="16" font-weight="700" fill="#69727a" text-anchor="start"><tspan x="40" dy="0">Danger Zone のヘッダー</tspan></text><text x="40" y="342" font-family="'SF Mono', Menlo, 'Noto Sans JP', monospace" font-size="17" font-weight="700" fill="#3a3f44" text-anchor="start" xml:space="preserve"><tspan x="40" dy="0">TypeSafe-Danger-Zone-Long-Context: true</