<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="340" viewBox="0 0 1160 340" role="img"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#232F3E"/></marker></defs><rect width="1160" height="340" fill="white"/><path d="M24 14L1136 14" fill="none" stroke="#232F3E" stroke-width="1.6"/><text x="24.0" y="66" fill="#345c6b" font-family="Noto Sans JP, Hiragino Sans, sans-serif" font-size="25" text-anchor="start" font-weight="600"><tspan x="24.0" dy="0">URLがクライアントID</tspan></text><text x="24.0" y="110" fill="#232F3E" font-family="Noto Sans JP, Hiragino Sans, sans-serif" font-size="20" text-anchor="start" font-weight="400"><tspan x="24.0" dy="0">メタデータのURLを</tspan><tspan x="24.0" dy="31.0">クライアントIDにする</tspan><tspan x="24.0" dy="31.0">Cognitoが中身を見る</tspan></text><text x="24.0" y="304" fill="#345c6b" font-family="Noto Sans JP, Hiragino Sans, sans-serif" font-size="20" text-anchor="start" font-weight="600"><tspan x="24.0" dy="0">登録が残らない</tspan></text><path d="M24.0 268L60.0 268" fill="none" stroke="#4a8399" stroke-width="2"/><path d="M302.0 34L302.0 326" fill="none" stroke="#dde3e6" stroke-width="1"/><text x="330.0" y="66" fill="#232F3E" font-family="Noto Sans JP, Hiragino Sans, sans-serif" font-size="25" text-anchor="start" font-weight="600"><tspan x="330.0" dy="0">CIMDポリシー</tspan></text><text x="330.0" y="110" fill="#232F3E" font-family="Noto Sans JP, Hiragino Sans, sans-serif" font-size="20" text-anchor="start" font-weight="400"><tspan x="330.0" dy="0">許可するURLを</tspan><tspan x="330.0" dy="31.0">アプリクライアント</tspan><tspan x="330.0" dy="31.0">1つに対応づける</tspan></text><text x="330.0" y="304" fill="#345c6b" font-family="Noto Sans JP, Hiragino Sans, sans-serif" font-size="20" text-anchor="start" font-weight="600"><tspan x="330.0" dy="0">アプリクライアントは1つ</tspan></text><path d="M330.0 268L366.0 268" fill="none" stroke="#4a8399" stroke-width="2"/><path d="M580.0 34L580.0 326" fill="none" stroke="#dde3e6" stroke-width="1"/><text x="608.0" y="66" fill="#232F3E" font-family="Noto Sans JP, Hiragino Sans, sans-serif" font-size="25" text-anchor="start" font-weight="600"><tspan x="608.0" dy="0">リソースサーバー</tspan></text><text x="608.0" y="110" fill="#232F3E" font-family="Noto Sans JP, Hiragino Sans, sans-serif" font-size="20" text-anchor="start" font-weight="400"><tspan x="608.0" dy="0">GatewayのURLを</tspan><tspan x="608.0" dy="31.0">識別子にして登録する</tspan><tspan x="608.0" dy="31.0">ないと交換で失敗する</tspan></text><text x="608.0" y="304" fill="#345c6b" font-family="Noto Sans JP, Hiragino Sans, sans-serif" font-size="20" text-anchor="start" font-weight="600"><tspan x="608.0" dy="0">宛先はaudに入る</tspan></text><path d="M608.0 268L644.0 268" fill="none" stroke="#4a8399" stroke-width="2"/><path d="M858.0 34L858.0 326" fill="none" stroke="#dde3e6" stroke-width="1"/><text x="886.0" y="66" fill="#232F3E" font-family="Noto Sans JP, Hiragino Sans, sans-serif" font-size="25" text-anchor="start" font-weight="600"><tspan x="886.0" dy="0">なりすまし</tspan></text><text x="886.0" y="110" fill="#232F3E" font-family="Noto Sans JP, Hiragino Sans, sans-serif" font-size="20" text-anchor="start" font-weight="400"><tspan x="886.0" dy="0">PCの別のアプリも</tspan><tspan x="886.0" dy="31.0">本物のURLを使える</tspan><tspan x="886.0" dy="31.0">URLとスコープを絞る</tspan></text><text x="886.0" y="304" fill="#345c6b" font-family="Noto Sans JP, Hiragino Sans, sans-serif" font-size="20" text-anchor="start" font-weight="600"><tspan x="886.0" dy="0">CIMDだけでは防げない</tspan></text><path d="M886.0 268L922.0 268" fill="none" stroke="#4a8399" stroke-width="2"/>
