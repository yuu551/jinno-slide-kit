pan x="824" dy="0">プロンプトも応答も見られない</tspan></text><path d="M680 115 L760 115" fill="none" stroke="#b9c0c6" stroke-width="1.6" stroke-linejoin="round" stroke-dasharray="7 6"/><path d="M765 104L787 126M787 104L765 126" stroke="#c2703d" stroke-width="3.6" stroke-linecap="round"/><rect x="0" y="254" width="674" height="136" rx="6" fill="#f9efe7"/><text x="20" y="288" font-family="'Noto Sans JP', 'Hiragino Sans', sans-serif" font-size="17" font-weight="700" fill="#c2703d" text-anchor="start"><tspan x="20" dy="0">例外</tspan></text><text x="20" y="320" font-family="'Noto Sans JP', 'Hiragino Sans', sans-serif" font-size="18" font-weight="700" fill="#3a3f44" text-anchor="start"><tspan x="20" dy="0">一部のモデルは最大30日のデータ保持が必要</tspan></text><text x="20" y="350" font-family="'Noto Sans JP', 'Hiragino Sans', sans-serif" font-size="17" font-weight="400" fill="#3d444b" text-anchor="start"><tspan x="20" dy="0">データ保持モードを none にすると</tspan></text><text x="20" y="374" font-family="'Noto Sans JP', 'Hiragino Sans', sans-serif" font-size="17" font-weight="400" fill="#3d444b" text-anchor="start"><tspan x="20" dy="0">そうしたモデルの呼び出しはエラーで拒否される</tspan></text><text x="700" y="230" font-family="'Noto Sans JP', 'Hiragino Sans', sans-serif" font-size="17" font-weight="700" fill="#69727a" text-anchor="start"><tspan x="700" dy="0">組み合わせて守る</tspan></text><rect x="700" y="246" width="460" height="40" rx="4" fill="#fff" stroke="#b9c0c6" stroke-width="1.2"/><text x="716" y="273" font-family="'Noto Sans JP', 'Hiragino Sans', sans-serif" font-size="17" font-weight="700" fill="#2f6273" text-anchor="start"><tspan x="716" dy="0">IAM</tspan></text><text x="900" y="273" font-family="'Noto Sans JP', 'Hiragino Sans', sans-serif" font-size="16" font-weight="400" fill="#3d444b" text-anchor="start"><tspan x="900" dy="0">誰が何を呼べるか</tspan></text><rect x="700" y="294" width="460" height="40" rx="4" fill="#fff" stroke="#b9c0c6" stroke-width="1.2"/><text x="716" y="321" font-family="'Noto Sans JP', 'Hiragino Sans', sans-serif" fon