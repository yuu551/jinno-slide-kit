<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="380" viewBox="0 0 1160 380"><rect width="1160" height="380" fill="#fff"/><rect x="0" y="0" width="268" height="120" rx="0" fill="#edf4f6"/><rect x="0" y="0" width="268" height="4" fill="#4a8399"/><text x="22" y="52" font-family="'Noto Sans JP', 'Hiragino Sans', sans-serif" font-size="20" font-weight="700" fill="#2f6273" text-anchor="start"><tspan x="22" dy="0">よく来る問い合わせを</tspan><tspan x="22" dy="29.0">1つ選ぶ</tspan></text><path d="M276.0 48L288.0 60L276.0 72" fill="none" stroke="#b9c0c6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="296" y="0" width="268" height="120" rx="0" fill="#f4f5f7"/><rect x="296" y="0" width="268" height="4" fill="#3a3f44"/><text x="318" y="52" font-family="'Noto Sans JP', 'Hiragino Sans', sans-serif" font-size="20" font-weight="700" fill="#3a3f44" text-anchor="start"><tspan x="318" dy="0">期待する要点と</tspan><tspan x="318" dy="29.0">根拠の文書を書く</tspan></text><path d="M572.0 48L584.0 60L572.0 72" fill="none" stroke="#b9c0c6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="592" y="0" width="268" height="120" rx="0" fill="#f4f5f7"/><rect x="592" y="0" width="268" height="4" fill="#3a3f44"/><text x="614" y="52" font-family="'Noto Sans JP', 'Hiragino Sans', sans-serif" font-size="20" font-weight="700" fill="#3a3f44" text-anchor="start"><tspan x="614" dy="0">答えがないときの</tspan><tspan x="614" dy="29.0">動きも書く</tspan></text><path d="M868.0 48L880.0 60L868.0 72" fill="none" stroke="#b9c0c6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="888" y="0" width="268" height="120" rx="0" fill="#f4f5f7"/><rect x="888" y="0" width="268" height="4" fill="#3a3f44"/><text x="910" y="52" font-family="'Noto Sans JP', 'Hiragino Sans', sans-serif" font-size="20" font-weight="700" fill="#3a3f44" text-anchor="start"><tspan x="910" dy="0">検索結果を見て</tspan><tspan x="910" dy="29.0">どこで欠けたかを見る</tspan></text><text x="0" y="172" font-family="'Noto Sans JP', 'Hiragino Sans', sans-serif" font-size="18" font-weight="700" fill="#69727a" text-anchor="start"><tspan x="0" dy="0">1件に書くこと</tspan></text><rect x="0" y="186" width="1160" height="194" rx="8" fill="#fff" stroke="#b9c0c6" stroke-width="1.4"/><circle cx="28" cy="223" r="5" fill="#4a8399"/><text x="46" y="230" font-family="'Noto Sans JP', 'Hiragino Sans', sans-serif" font-size="19" font-weight="700" fill="#3a3f44" text-anchor="start"><tspan x="46" dy="0">質問</tspan></text><text x="250" y="230" font-family="'Noto Sans JP', 'Hiragino Sans', sans-serif" font-size="19" font-weight="400" fill="#3d444b" text-anchor="start"><tspan x="250" dy="0">実際に届いた言い回しのまま書く</tspan></text><circle cx="28" cy="263" r="5" fill="#4a8399"/><text x="46" y="270" font-family="'Noto Sans JP', 'Hiragino Sans', sans-serif" font-size="19" font-weight="700" fill="#3a3f44" text-anchor="start"><tspan x="46" dy="0">期待する要点</tspan></text><text x="250" y="270" font-family="'Noto Sans JP', 'Hiragino Sans', sans-serif" font-size="19" font-weight="400" fill="#3d444b" text-anchor="start"><tspan x="250" dy="0">答えに入っていてほしいことを2〜3個</tspan></text><circle cx="28" cy="303" r="5" fill="#4a8399"/><text x="46" y="310" font-family="'Noto Sans JP', 'Hiragino Sans', sans-serif" font-size="19" font-weight="700" fill="#3a3f44" text-anchor="start"><tspan x="46" dy="0">根拠の文書</tspan></text><text x="250" y="310" font-family="'Noto Sans JP', 'Hiragino Sans', sans-serif" font-size="19" font-weight="400" fill="#3d444b" text-anchor="start"><tspan x="250" dy="0">その答えが書いてある文書の名前</tspan></text><circle cx="28" cy="343" r="5" fill="#4a8399"/><text x="46" y="350" font-family="'Noto Sans JP', 'Hiragino Sans', sans-serif" font-size="19" font-weight="700" fill="#3a3f44" text-anchor="start"><tspan x="46" dy="0">答えがないとき</tspan></text><text x="250" y="350" font-family="'Noto Sans JP', 'Hiragino Sans', sans-serif" font-size="19" font-weight="400" fill="#3d444b" text-anchor="start"><tspan x="250" dy="0">聞き返すか、調べた中身を書いて人へ渡すか</tspan></text>
