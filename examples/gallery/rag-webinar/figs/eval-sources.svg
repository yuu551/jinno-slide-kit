"0">「AとBはどう違う？」</tspan></text><rect x="470" y="116" width="690" height="56" rx="4" fill="#f4f5f7"/><text x="494" y="152" font-family="'Noto Sans JP', 'Hiragino Sans', sans-serif" font-size="20" font-weight="700" fill="#3a3f44" text-anchor="start"><tspan x="494" dy="0">契約や権限の条件が絡む</tspan></text><text x="1140" y="152" font-family="'Noto Sans JP', 'Hiragino Sans', sans-serif" font-size="17" font-weight="400" fill="#69727a" text-anchor="end"><tspan x="1140" dy="0">プランや本人確認で答えが変わる</tspan></text><rect x="470" y="182" width="690" height="56" rx="4" fill="#f4f5f7"/><text x="494" y="218" font-family="'Noto Sans JP', 'Hiragino Sans', sans-serif" font-size="20" font-weight="700" fill="#3a3f44" text-anchor="start"><tspan x="494" dy="0">文書だけでは足りない</tspan></text><text x="1140" y="218" font-family="'Noto Sans JP', 'Hiragino Sans', sans-serif" font-size="17" font-weight="400" fill="#69727a" text-anchor="end"><tspan x="1140" dy="0">外部のシステムの確認が要る</tspan></text><rect x="470" y="248" width="690" height="56" rx="4" fill="#f4f5f7"/><text x="494" y="284" font-family="'Noto Sans JP', 'Hiragino Sans', sans-serif" font-size="20" font-weight="700" fill="#3a3f44" text-anchor="start"><tspan x="494" dy="0">答えずに人へ渡すべき</tspan></text><text x="1140" y="284" font-family="'Noto Sans JP', 'Hiragino Sans', sans-serif" font-size="17" font-weight="400" fill="#69727a" text-anchor="end"><tspan x="1140" dy="0">請求・返金・障害の判断</tspan></text><rect x="470" y="314" width="690" height="56" rx="4" fill="#f4f5f7"/><text x="494" y="350" font-family="'Noto Sans JP', 'Hiragino Sans', sans-serif" font-size="20" font-weight="700" fill="#3a3f44" text-anchor="start"><tspan x="494" dy="0">過去に間違えた質問</tspan></text><text x="1140" y="350" font-family="'Noto Sans JP', 'Hiragino Sans', sans-serif" font-size="17" font-weight="400" fill="#69727a" text-anchor="end"><tspan x="1140" dy="0">誤回答や「改善希望」が付いた</tspan></text>
