<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Marpエディター</title>
<!-- スライド内の画像（figs/…）はデッキのフォルダから読む。アプリ自身のURLは / から始める -->
<base href="/deck/">
<link rel="stylesheet" href="/app.css">
<style id="marp-css"></style>
</head>
<body>
<header id="toolbar">
  <a id="btn-hub" class="mj-back" hidden title="資料の一覧（ライブラリー）へ戻る">← 一覧</a>
  <button type="button" id="btn-left" class="mj-icon-btn" title="一覧を切り替え（サムネイル／見出し）"></button>
  <span class="mj-file-wrap">
    <span id="file-name" class="mj-file" role="button" tabindex="0" aria-haspopup="menu"></span>
    <span id="file-menu" class="mj-menu" role="menu" hidden>
      <button type="button" data-file="reveal">Finder で表示</button>
      <button type="button" data-file="rename">名前を変える…</button>
    </span>
  </span>
  <span id="status" class="mj-status">読み込み中…</span>
  <span class="mj-spacer"></span>
  <button type="button" id="btn-undo" class="mj-icon-btn" title="元に戻す（⌘Z）" disabled></button>
  <button type="button" id="btn-redo" class="mj-icon-btn" title="やり直す（⇧⌘Z）" disabled></button>
  <span class="mj-sep"></span>
  <span class="mj-insert">
    <button type="button" id="btn-insert" title="ページを追加">＋ ページ</button>
    <span id="insert-menu" class="mj-menu" role="menu" hidden></span>
  </span>
  <span class="mj-view" role="group" aria-label="表示">
    <button type="button" data-view="slide" class="is-on" title="スライドを見ながら直接直す（⌘/ で切り替え）"><span class="mj-view-symbol" aria-hidden="true">▣</span><span class="mj-view-text">スライド</span></button>
    <button type="button" data-view="split" title="左にMarkdown、右にスライド（⌘/ で切り替え）"><span class="mj-view-symbol" aria-hidden="true">◫</span><span class="mj-view-text">Markdown と並べる</span></button>
  </span>
  <span class="mj-issues-menu">
    <button type="button" id="summary" class="mj-summary" aria-haspopup="menu" title="見切れのあるページと表示の設定"></button>
    <span id="issues-menu" class="mj-menu" role="menu" hidden>
      <button type="button" id="btn-next-issue">次の要確認ページへ</button>
      <button type="button" id="btn-issues" title="検査の表示を切り替え（⌘⇧I）"></button>
    </span>
  </span>
  <span class="mj-help-menu">
    <button type="button" id="btn-help-menu" aria-haspopup="menu">ヘルプ ▾</button>
    <span id="help-menu" class="mj-menu" role="menu" hidden>
      <button type="button" id="btn-cheat" title="部品の書き方と見本（⌘⇧K）">書き方の一覧</button>
      <button type="button" id="btn-help" title="ショートカット（?）">ショートカット</button>
    </span>
  </span>
  <span class="mj-export">
    <button type="button" id="btn-export" title="PDF・PowerPoint・HTMLに書き出す（⌘⇧E）">書き出し</button>
    <span id="export-menu" class="mj-menu mj-export-menu" role="menu" hidden>
      <button type="button" data-x="pdf"><b>PDF</b><small>お客様に渡す・印刷する用。発表者ノートは入れません</small></button>
      <button type="button" data-x="pdf-notes"><b>発表者用PDF</b><small>発表者ノートを注釈として入れる。社内・自分用</small></button>
      <button type="button" data-x="pdf-chrome" hidden><b>PDF（Chrome で書き出す）</b><small>コマンドの書き出しと同じ見た目。文字の折り返しが変わる場合があります</small></button>
      <button type="button" data-x="pptx"><b>PowerPoint（PPTX）</b><small>文字・図形・表を直せる形で。Googleスライドにもそのまま</small></button>
      <button type="button" data-x="html"><b>HTML</b><small>ブラウザで開ける。figs と一緒にフォルダで</small></button>
      <hr>
      <button type="button" data-x="reveal"><small>書き出したフォルダを Finder で開く</small></button>
    </span>
  </span>
  <span class="mj-more">
    <button type="button" id="btn-more" title="そのほかの操作" aria-haspopup="menu">…</button>
    <span id="more-menu" class="mj-menu" role="menu" hidden>
      <button type="button" data-more="export">書き出し…</button>
      <button type="button" data-more="cheat">書き方の一覧</button>
      <button type="button" data-more="help">ショートカット</button>
      <button type="button" data-more="issues">検査の表示を切り替え</button>
      <button type="button" data-more="summary">要確認のページへ</button>
      <label class="mj-check"><input type="checkbox" id="autosave"> 自動保存</label>
    </span>
  </span>
  <button type="button" id="btn-present" class="mj-primary" title="今のページから発表（⌘⏎）">▶ 発表</button>
  <button type="button" id="btn-save" class="mj-primary" title="保存（⌘S）">保存</button>
  <button type="button" id="btn-right" class="mj-icon-btn" title="右のサイドバーを閉じる（⌘⌥\）"></button>
</header>
<div id="banner" hidden></div>
<main id="app">
  <nav id="thumbs" aria-label="スライド一覧"></nav>
  <div id="source" hidden></div>
  <div id="split-bar" title="ドラッグで幅を変える" aria-hidden="true"></div>
  <section id="center">
    <div id="stage-wrap">
      <div id="stage"></div>
    </div>
    <span id="page-no"></span>
    <span id="zoom" class="mj-zoom"></span>
  </section>
  <aside id="inspector"></aside>
</main>
<div id="measure" aria-hidden="true"></div>
<div id="modal" hidden></div>
<div id="overlay" hidden></div>
<div id="ctx-menu" class="mj-menu mj-ctx" role="menu" hidden></div>
<div id="table-bar" class="mj-table-bar" hidden></div>
<div id="format-bar" class="mj-format-bar" hidden></div>
<div id="drop-hint" hidden><span>画像をドロップすると figs/ に保存して、このページに入れます</span></div>
<div id="toast" hidden></div>
<script type="module" src="/app.js"></script>
<script type="module" src="/present-launch.js"></script>
</body>
</html>
