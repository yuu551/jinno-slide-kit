<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>発表</title>
<!-- スライド内の画像（figs/…）はデッキのフォルダから読む。アプリ自身のURLは / から始める -->
<base href="/deck/">
<link rel="stylesheet" href="/present.css">
<style id="marp-css"></style>
</head>
<body class="pv-present" data-view="present">
<main id="stage">
  <div id="view"></div>
  <div id="blank" hidden></div>
  <div id="jump" class="pv-jump" hidden></div>
  <div id="hint" class="pv-hint" hidden>
    <span><kbd>F</kbd> 全画面</span><span><kbd>S</kbd> 発表者画面</span><span><kbd>B</kbd> 黒画面</span><span><kbd>?</kbd> 操作一覧</span>
  </div>
  <nav id="bar" class="pv-bar" aria-label="発表の操作">
    <button type="button" id="bar-prev" title="前へ（←）" aria-label="前へ"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
    <span id="bar-page" class="pv-bar-page"></span>
    <button type="button" id="bar-next" title="次へ（→）" aria-label="次へ"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
    <span class="pv-bar-sep"></span>
    <button type="button" id="bar-presenter" title="発表者画面を開く（S）"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="1.5"/><path d="M8 20h8M12 16v4"/></svg><span>発表者画面</span></button>
    <button type="button" id="bar-full" title="全画面（F）" aria-label="全画面"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
    <button type="button" id="bar-help" title="操作一覧（?）" aria-label="操作一覧"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.7.3-1 .9-1 1.7M12 17h.01"/></svg></button>
    <span class="pv-bar-track"><i id="bar-progress"></i></span>
  </nav>
  <div id="help" class="pv-help" hidden></div>
</main>
<script type="module" src="/present.js"></script>
</body>
</html>
